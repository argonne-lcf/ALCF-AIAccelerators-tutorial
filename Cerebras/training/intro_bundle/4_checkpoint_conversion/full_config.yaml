trainer:
  fit:
    train_dataloader:
      batch_size: 960
      data_dir: /home/fungerous/training_intro_bundle/data_processing/nlp/3_h5/
      data_processor: GptHDF5MapDataProcessor
      num_workers: 8
      persistent_workers: true
      prefetch_factor: 10
      shuffle: false
      shuffle_seed: 1337
    val_dataloader: &id001
      batch_size: 300
      data_dir: /home/fungerous/training_intro_bundle/data_processing/nlp/3_h5/
      data_processor: GptHDF5MapDataProcessor
      num_workers: 0
      shuffle: false
  init:
    model_dir: "./model_dir/"
    backend:
      backend_type: CSX
    callbacks:
    - GlobalFlags:
        csx.debug.compile_crd_memory_gi: 67
        csx.debug.execute_crd_memory_gi: 50
        csx.debug.wrk_memory_gi: 120
    - ScopedTrainFlags:
        csx.performance.micro_batch_size: 22
    - ScopedValidateFlags:
        csx.performance.micro_batch_size: 22
    - ComputeNorm: {}
    - LoadCheckpointStates:
        load_checkpoint_states: model
    checkpoint:
      disable_strict_checkpoint_loading: true
      save_initial_checkpoint: false
      steps: 1000000
    logging:
      log_steps: 1
    loop:
      eval_steps: 2
      max_steps: 12000
      eval_frequency: 2384
    model:
     attention_dropout_rate: 0.0
     attention_module: multiquery_attention
     attention_type: scaled_dot_product
     dropout_rate: 0.0
     embedding_dropout_rate: 0.0
     embedding_layer_norm: false
     extra_attention_params:
         num_kv_groups: 8
     filter_size: 14336
     hidden_size: 4096
     initializer_range: 0.02
     layer_norm_epsilon: 1.0e-05
     max_position_embeddings: 8192
     name: llama
     nonlinearity: swiglu
     norm_type: rmsnorm
     num_heads: 32
     num_hidden_layers: 32
     pos_scaling_factor: 1.0
     position_embedding_type: rotary
     rope_theta: 500000.0
     rotary_dim: 128
     share_embedding_weights: false
     use_bias_in_output: false
     use_ffn_bias: false
     use_ffn_bias_in_attention: false
     use_projection_bias_in_attention: false
     vocab_size: 128256
    optimizer:
      Adam:
        betas:
        - 0.9
        - 0.95
        correct_bias: true
        weight_decay: 0.1
    precision:
      enabled: true
      fp16_type: cbfloat16
      log_loss_scale: true
      loss_scaling_factor: dynamic
      max_gradient_norm: 1.0
    schedulers:
    - LinearLR:
        initial_learning_rate: 0.0
        end_learning_rate: 7.5e-05
        total_iters: 4768
    seed: 1
  validate:
    val_dataloader: *id001
  validate_all:
    val_dataloaders: *id001
